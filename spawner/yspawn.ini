; Quick-skirmish settings for spawn.py run. Copied to the game directory on every run.
; Countries (rulesmd [Countries]): 0 America, 1 Korea, 2 France, 3 Germany, 4 Britain,
;   5 Libya, 6 Iraq, 7 Cuba, 8 Russia, 9 Yuri
; Colours: 0 gold, 1 red, 2 blue, 3 green, 4 orange, 5 sky blue, 6 purple, 7 pink
; AI difficulty: 0 hard, 1 medium, 2 easy
; Start: start position 0-7 (the map's waypoints 0-7; Skirmish Setup shows them as 1-8), -1 random
; Team: 0-3 = teams A-D, -1 no team. Players on the same team are allied from the start.

[Settings]
Map=Tsunami.mmx         ; any .mmx or .yro in the game directory
Name=Tester
Country=0
Color=0
Start=-1
Team=-1
Credits=10000
GameSpeed=0             ; 0 fastest ... 6 slowest
UnitCount=0             ; extra starting units
TechLevel=10
ShortGame=1
Superweapons=1
HumanInPeace=0         ; 1: AI ignores the human; protects against damage and hostile capture
TeamTelemetry=0         ; 1: sample large Brutal teams, 2: include all teams (custom launcher only)
Crates=0
Bases=1
MCVRedeploy=1
BuildOffAlly=1
GameMode=1              ; 1 Battle (mpmodesmd.ini)

[AI1]
Country=8
Color=1
Difficulty=2
Start=-1
Team=-1

; more opponents: [AI2] ... [AI7] with the same keys (the map needs enough start positions)

; optional starting bases, like Empire Wars in Age of Empires II (skirmish.py writes this; startbase.py prints them):
; every house of a listed country starts with those buildings instead of its MCV, the first one where the MCV stood
; [StartBase]
; Remove=AMCV,SMCV,PCV                    ; the vehicles taken away
; Americans=GACNST,GAPOWR,GAREFN,GAPILE   ; COUNTRY=BUILDING,...

; optional test vehicles and buildings, placed once the match has loaded (showcase.py writes these):
; [Units]
; 1=ATTNK,Americans,59,102,112,Sleep     ; TYPE,COUNTRY,X,Y,FACING 0-255,MISSION (Sleep/Guard/Area_Guard/Hunt)
; 2=GAWEAP,Americans,60,99,0,-           ; a building: X,Y is its top-left cell, moved to the nearest free spot
